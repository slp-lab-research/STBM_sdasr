defaults:
  - train_qwen25_omni_7b_speaker_kernel_boundary_no_temporal_convolution_alimeeting
  - _self_

exp_dir: experiments/diarization_AliMeeting_boundary_only_qwen25_omni_7b

model:
  # Kernel ablation (kept here as comments so the removed components are explicit):
  # speaker_kernel_enabled: true
  # The ordered kernel is removed, but cross-attention remains to fuse streams.
  # speaker_kernel_cross_attention_enabled: false
  # speaker_kernel_use_temporal_convolution: false
  speaker_kernel_enabled: false
  speaker_kernel_cross_attention_enabled: true
  speaker_kernel_use_temporal_convolution: false
  use_boundary_loss: true

trainer:
  llm_loss_weight: 1.0
  boundary_loss_weight: 1.0
  ctc_loss_weight: 0.0
