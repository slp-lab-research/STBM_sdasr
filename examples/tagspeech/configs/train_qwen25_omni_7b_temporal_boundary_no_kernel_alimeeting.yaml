defaults:
  - train_qwen25_omni_7b_speaker_kernel_boundary_no_temporal_convolution_alimeeting
  - _self_

exp_dir: experiments/diarization_AliMeeting_temporal_boundary_no_kernel_qwen25_omni_7b

model:
  # Ordered-kernel ablation: retain these original kernel settings as comments.
  # speaker_kernel_enabled: true
  # ordered_kernel_num_speakers: 4
  # ordered_kernel_probability_hidden_dim: null
  # ordered_kernel_probability_dropout: 0.1
  # ordered_kernel_scale: 0.1
  # ordered_kernel_learnable_scale: true

  # H_spk -> temporal convolution -> cross-attention and boundary head.
  speaker_kernel_enabled: false
  speaker_kernel_use_temporal_convolution: true
  speaker_kernel_cross_attention_enabled: true
  use_boundary_loss: true

trainer:
  llm_loss_weight: 1.0
  boundary_loss_weight: 1.0
  ctc_loss_weight: 0.0
