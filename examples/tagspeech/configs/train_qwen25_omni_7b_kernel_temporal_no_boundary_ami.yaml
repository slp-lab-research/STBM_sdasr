defaults:
  - train_qwen25_omni_7b_speaker_kernel_boundary_no_temporal_convolution_ami
  - _self_

exp_dir: experiments/diarization_AMI_kernel_temporal_no_boundary_qwen25_omni_7b

model:
  # Speaker temporal convolution and ordered kernel feed cross-attention.
  use_segment_speaker_kernel: true
  use_speaker_kernel_cross_attention: true
  speaker_kernel_enabled: true
  speaker_kernel_use_temporal_convolution: true
  speaker_kernel_cross_attention_enabled: true
  use_boundary_loss: false
  use_ctc_loss: false

trainer:
  llm_loss_weight: 1.0
  boundary_loss_weight: 0.0
  ctc_loss_weight: 0.0
