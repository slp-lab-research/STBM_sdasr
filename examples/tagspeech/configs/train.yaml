# Replace /path/to/... with local paths; relative paths start at examples/tagspeech.
seed: 114514

exp_dir: experiments/diarization_AMI
hydra:
  run:
    dir: ${exp_dir}/logs/${now:%Y-%m-%d}/${now:%H-%M-%S}

model:
  model_type: tagspeech

  audio_encoder:
    model_type: zipformer
    pretrained_model: experiments/diarization_AMI/audio_encoder/model_ami_audio.safetensors
    frozen: True

  voice_encoder:
    model_type: zipformer
    pretrained_model: experiments/diarization_AMI/voice_encoder/model_ami_voice.safetensors
    frozen: True

  llm:
    model_type: qwen2_5_omni
    # Replace with the complete local Qwen2.5 Omni checkpoint directory.
    pretrained_model: /path/to/Qwen2.5-Omni-7B
    dtype: bfloat16
    use_flash_attn: False
    frozen: True

  audio_token: <|AUDIO|>
  tag_audio_boundary: False
  pretrained_adapter: null
  pretrained_semantic_adapter: null
  pretrained_voice_adapter: null
  max_length: 800 # in model structure

  semantic_projector_ds_rate: 4
  voice_projector_ds_rate: 4

  semantic_anchor_interval: 8
  voice_anchor_interval: 8
  insert_anchors_at_ends: True
  digit_embedding_path: utils/digit_embeddings.pt

  # === ORDERED SPEAKER KERNEL CONFIG ===
  # Experimental single-stream path: pool both projected streams on the same
  # temporal grid, inject speaker information into semantic segments, then
  # insert numeric anchors and send the conditioned sequence to the LLM.
  use_segment_speaker_kernel: True
  ordered_kernel_num_speakers: 4
  ordered_kernel_probability_hidden_dim: null
  ordered_kernel_probability_dropout: 0.1
  ordered_kernel_scale: 0.1
  ordered_kernel_learnable_scale: True
  ordered_kernel_normalize_semantic: False
  use_boundary_loss: False
  # === END ORDERED SPEAKER KERNEL CONFIG ===

  exclude_from_checkpoint:
    - audio_encoder
    - voice_encoder
    - llm

trainer:
  optimizer:
    type: "adam"
    lr: 0.001
  scheduler:
    type: "eden"
    lr_epochs: 3.5
    lr_batches: 7500
    warmup_batches: 500
    lr_steps_per_epoch: 0
  num_epochs: 30
  start_epoch: 1
  num_steps: 100000
  start_batch: 0
  keep_last_k: 100
  use_averaged_model: True
  log_interval: 50
  average_period: 200
  reset_interval: 200
  valid_interval: 500
  save_every_n: 4
  use_fp16: True
  tensorboard: True

data:
  train_data_config: configs/AMI/data_configs/train_data_config.yaml
  valid_data_config: configs/AMI/data_configs/valid_data_config.yaml
  on_the_fly_feats: True
  feature: fbank
  sampling_rate: 16000
  channel: 0
  use_infinite_dataset: True
  data_augmentation:
    enable_spec_aug: True
    enable_musan: False
    musan:
    enable_speed_perturb: False
  sampler:
    type: bucketing_sampler
    num_buckets: 30
    max_duration: 80
    shuffle: True
    drop_last: True
  text_normalization: True
  pad_to_30s: False
  num_workers: 1

prompt_file: configs/prompt.yaml
