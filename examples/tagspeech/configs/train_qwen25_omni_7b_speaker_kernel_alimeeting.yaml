# Replace /path/to/... with local paths; relative paths start at examples/tagspeech.
defaults:
  - train
  - _self_

exp_dir: experiments/diarization_AliMeeting_speaker_kernel_crossattn_qwen25_omni_7b

hydra:
  run:
    dir: ${exp_dir}/logs/${now:%Y-%m-%d}/${now:%H-%M-%S}

model:
  audio_encoder:
    pretrained_model: experiments/diarization_AliMeeting/audio_encoder/model.safetensors
    frozen: true
  voice_encoder:
    pretrained_model: experiments/diarization_AliMeeting/voice_encoder/model.safetensors
    frozen: true
  llm:
    model_type: qwen2_5_omni
    pretrained_model: /path/to/Qwen2.5-Omni-7B
    dtype: bfloat16
    use_flash_attn: false
    frozen: true
  audio_token: <|AUDIO|>
  max_length: 800
  use_segment_speaker_kernel: true
  use_speaker_kernel_cross_attention: true
  speaker_kernel_attention_heads: 8
  speaker_kernel_attention_dropout: 0.0
  speaker_kernel_temporal_kernel_size: 3
  speaker_kernel_use_temporal_convolution: true
  speaker_kernel_adapter_expansion: 4
  speaker_kernel_adapter_dropout: 0.1
  ordered_kernel_num_speakers: 4
  ordered_kernel_probability_hidden_dim: null
  ordered_kernel_probability_dropout: 0.1
  ordered_kernel_scale: 0.1
  ordered_kernel_learnable_scale: true
  ordered_kernel_normalize_semantic: false
  use_boundary_loss: true
  exclude_from_checkpoint:
    - audio_encoder
    - voice_encoder
    - llm

trainer:
  optimizer:
    lr: 0.0001
  use_averaged_model: true
  llm_loss_weight: 1.0
  boundary_loss_weight: 1.0

data:
  train_data_config: configs/AliMeeting/data_configs/train_data_config.yaml
  valid_data_config: configs/AliMeeting/data_configs/valid_data_config.yaml
  channel: 0
